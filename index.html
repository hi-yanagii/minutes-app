<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>テキスト要約インターフェイス</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 30px;
            background-color: #f4f6f8;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        p {
            font-size: 14px;
            color: #555;
        }
        textarea {
            width: 100%;
            height: 180px;
            margin-bottom: 15px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            resize: vertical;
        }
        /* 要約ボタン */
        .summary-btn {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .summary-btn:hover {
            background-color: #2c5282;
        }
        .result-section {
            margin-top: 25px;
        }
        .result-box {
            background: #edf2f7;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #2b6cb0;
            min-height: 80px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>音声テキスト要約ツール</h2>
        <p>テキスト化された文章を入力し、<strong>「要約する」ボタン</strong>を押してください。（時系列を優先し、通常の自然な文章で出力します）</p>
        
        <textarea id="inputText" placeholder="ここにテキストを入力または貼り付けてください..."></textarea>
        
        <div>
            <button id="summaryButton" class="summary-btn">要約する</button>
        </div>

        <div class="result-section">
            <h3>要約結果</h3>
            <div id="resultArea" class="result-box">ここに要約結果が表示されます...</div>
        </div>
    </div>

    <script>
        document.getElementById('summaryButton').addEventListener('click', () => {
            const text = document.getElementById('inputText').value.trim();
            
            if (!text) {
                alert('要約するテキストを入力してください。');
                return;
            }

            // 時系列優先・体言止め/名詞化なしの要約処理をここに組み込みます（API連携など）
            // サンプルとしての動作表示
            const summaryResult = `【時系列要約（通常文体）】\n${text}\n\n（※ここに時系列の流れに沿った自然な文章の要約が出力されます）`;
            
            document.getElementById('resultArea').textContent = summaryResult;
        });
    </script>

</body>
</html>
